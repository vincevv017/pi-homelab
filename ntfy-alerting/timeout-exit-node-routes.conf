# Deploy to /etc/systemd/system/exit-node-routes.service.d/timeout.conf (Pi 1 only)
#
# ExecStartPre loops budget 90s (60s Mullvad + 30s tailscale0), and
# TimeoutStartSec covers the WHOLE start sequence including those pre-checks.
# 120 would leave only 30s for ExecStart and cause spurious failures on slow
# Mullvad reconnects; 240 gives the pre-checks their full budget plus margin.
#
# `tailscale up` in exit-node-setup.sh blocks forever when tailscaled cannot
# reach the coordination server (wiped 0x6d6f6c65 mark rule, or an expired
# node key). Bound the start so that surfaces as a failure, not a hang —
# and so OnFailure= actually fires.
[Service]
TimeoutStartSec=240
