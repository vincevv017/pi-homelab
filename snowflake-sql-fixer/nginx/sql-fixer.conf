# nginx/sql-fixer.conf
#
# Host nginx server block for the Snowflake SQL Fixer.
# Sits behind Tailscale Funnel (--tls-terminated-tcp --proxy-protocol=2),
# enforces the Snowflake egress-IP allowlist, and proxies exactly one path
# to the loopback-only FastAPI app.
#
# Install:
#   sudo cp sql-fixer.conf /etc/nginx/sites-available/sql-fixer
#   sudo ln -sf /etc/nginx/sites-available/sql-fixer /etc/nginx/sites-enabled/sql-fixer
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depends on:
#   - /etc/nginx/conf.d/sql-fixer-limits.conf   (limit_req_zone, http context)
#   - /etc/nginx/snowflake-egress-allow.conf    (generated by refresh_egress_allowlist.py)
#
# See ../guide_snowflake_sql_fixer.md (Phase C) for full context.

server {
    # Funnel (--tls-terminated-tcp=8443) connects here over loopback,
    # speaking PROXY protocol then plaintext HTTP.
    listen 127.0.0.1:9443 proxy_protocol;

    # Trust PROXY protocol only from the local Tailscale daemon.
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    # $remote_addr is now the Snowflake egress IP. Allowlist, then deny.
    include /etc/nginx/snowflake-egress-allow.conf;
    deny all;

    client_max_body_size 64k;

    location = /fix-sql {
        limit_req zone=fixsql burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Everything else is silently dropped.
    location / { return 444; }
}